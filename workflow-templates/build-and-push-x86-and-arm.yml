# vi:syntax=yaml
name: Build and Push to ECR
on:
  # This provides a button in the actions tab to run this on demand
  workflow_dispatch:
  push:
    # You can set these branches to any that you want to build and push images from
    branches: [$default-branch]
    # Set paths you can edit without triggering automated builds
    paths-ignore:
      - "docs/**"
      - "README.md"

jobs:
  build-and-push:
    name: Build and Push (${{ matrix.target_architecture }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target_architecture: [amd64, arm64]
        include:
          - target_architecture: amd64
            platform: ""
            image_tag: latest
          - target_architecture: arm64
            platform: linux/arm64
            image_tag: arm64

    permissions:
      id-token: write
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4.2.0
        if: matrix.target_architecture == 'arm64'
        with:
          platforms: linux/arm64

      - uses: docker/setup-buildx-action@v4.2.0
        if: matrix.target_architecture == 'arm64'
        with:
          version: latest

      - name: Build
        uses: glg/build-and-push/build@v1
        id: build
        with:
          platform: ${{ matrix.platform }}
          image_tag: ${{ matrix.image_tag }}

      - name: Healthcheck
        uses: glg/build-and-push/healthcheck@v1
        with:
          image_name: ${{ steps.build.outputs.image_name }}
          healthcheck: /
          port: 3000
          healthcheck_max_attempts: 5

      - name: Push
        uses: glg/build-and-push/push@v1
        with:
          image_name: ${{ steps.build.outputs.image_name }}
          #sync_to_aws_china: true
